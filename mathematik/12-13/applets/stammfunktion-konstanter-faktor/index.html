<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Faktorregel – Stammfunktionen</title>
  <script src="https://www.geogebra.org/apps/deployggb.js"></script>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(','\\)'], ['$', '$']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --border: #d7dce5;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --success: #15803d;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    body {
      padding: 18px;
    }

    .app-shell {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 18px;
      align-items: stretch;
    }

    .left-column,
    .control-column {
      min-width: 0;
    }

    .main-title {
      margin: 0 0 12px 2px;
      font-size: clamp(1.6rem, 3vw, 2.3rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .graph-card,
    .control-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .graph-card {
      overflow: hidden;
      margin-bottom: 16px;
    }

    .graph-card:last-child {
      margin-bottom: 0;
    }

    .card-heading {
      padding: 12px 16px 10px;
      font-weight: 700;
      font-size: 1.08rem;
      border-bottom: 1px solid var(--border);
      background: #fbfcfe;
    }

    .ggb-wrap {
      position: relative;
      height: 330px;
      min-height: 260px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .ggb-wrap > div {
      width: 100% !important;
      height: 100% !important;
    }

    /* Transparente Schutzfläche: keine Eingabe und keine Touch-Interaktion im Graphen. */
    .ggb-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 20;
      background: transparent;
      touch-action: none;
      cursor: default;
    }

    .card-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .control-column {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .reset-btn {
      width: 100%;
      border: 2px solid #253244;
      border-radius: 14px;
      padding: 12px 15px;
      background: #eff4fa;
      color: #253244;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow);
      touch-action: manipulation;
    }

    .reset-btn:hover { background: #e2eaf4; }
    .reset-btn:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
    .reset-btn:active { transform: translateY(1px); }

    .control-card {
      padding: 18px;
    }

    .control-title {
      margin: 0 0 18px;
      font-size: 1.3rem;
      font-weight: 800;
    }

    .slider-row {
      margin-bottom: 20px;
    }

    .slider-topline {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .k-value {
      min-width: 58px;
      text-align: center;
      background: var(--accent-soft);
      color: #1d4ed8;
      padding: 4px 9px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      height: 34px;
      cursor: pointer;
      touch-action: pan-x;
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 0.82rem;
      margin-top: -2px;
    }

    .formula-box {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 13px;
      margin: 10px 0;
      background: #fbfcfe;
      font-size: 1rem;
      overflow-x: auto;
    }

    .formula-label {
      color: var(--muted);
      font-size: 0.83rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 5px;
    }

    .check-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 16px;
      line-height: 1.35;
      font-weight: 600;
    }

    .check-row input {
      margin-top: 2px;
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
      flex: 0 0 auto;
    }

    .probe {
      margin-top: 16px;
      border-radius: 12px;
      border: 1px solid #bbf7d0;
      background: #f0fdf4;
      padding: 12px 13px;
      display: none;
    }

    .probe.visible { display: block; }
    .probe strong { color: var(--success); }

    .hint {
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.45;
    }

    @media (max-width: 900px) {
      body { padding: 12px; }
      .app-shell { grid-template-columns: 1fr; }
      .control-column { order: -1; }
      .ggb-wrap { height: 300px; }
      .main-title { margin-top: 4px; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="left-column">
      <h1 class="main-title">Faktorregel</h1>

      <article class="graph-card">
        <div class="card-heading"><span>Funktion <em>f</em></span></div>
        <div id="ggb-f" class="ggb-wrap" aria-label="Graph der Funktion f"></div>
      </article>

      <article class="graph-card">
        <div class="card-heading"><span>Stammfunktion <em>F</em></span></div>
        <div id="ggb-F" class="ggb-wrap" aria-label="Graph der Stammfunktion F"></div>
      </article>
    </section>

    <aside class="control-column">
      <button id="resetBtn" class="reset-btn" type="button">Zurücksetzen</button>

      <section class="control-card">
        <h2 class="control-title">Steuerbereich</h2>

        <div class="slider-row">
          <div class="slider-topline">
            <label for="kSlider">Faktor <em>k</em></label>
            <span id="kValue" class="k-value">1,0</span>
          </div>
          <input id="kSlider" type="range" min="-3" max="3" step="0.1" value="1" />
          <div class="range-labels"><span>−3</span><span>0</span><span>3</span></div>
        </div>

        <div class="formula-box">
          <div class="formula-label">Aktuelle Funktion</div>
          <div id="formulaF">\(f(x)=x^2\)</div>
        </div>

        <div class="formula-box">
          <div class="formula-label">Aktuelle Stammfunktion</div>
          <div id="formulaCapF">\(F(x)=\frac{1}{3}x^3\)</div>
        </div>

        <label class="check-row">
          <input id="showAntiderivative" type="checkbox" checked />
          <span>Stammfunktion im zweiten Diagramm anzeigen</span>
        </label>

        <label class="check-row">
          <input id="showProbe" type="checkbox" />
          <span>Ableitungsprobe anzeigen</span>
        </label>

        <div id="probeBox" class="probe">
          <div class="formula-label">Ableitungsprobe</div>
          <div id="probeFormula">\(F'(x)=x^2=f(x)\)</div>
          <div style="margin-top:6px"><strong>✓ Die Ableitung von F ist f.</strong></div>
        </div>

      </section>
    </aside>
  </main>

  <script>
    let appletF = null;
    let appletCapF = null;

    const fmt = (n) => {
      const rounded = Math.abs(n) < 1e-10 ? 0 : Math.round(n * 10) / 10;
      return rounded.toFixed(1).replace('.', ',');
    };

    function coeffLatex(k, variablePart) {
      const eps = 1e-10;
      if (Math.abs(k) < eps) return '0';
      if (Math.abs(k - 1) < eps) return variablePart;
      if (Math.abs(k + 1) < eps) return '-' + variablePart;
      return String(Math.round(k * 10) / 10).replace('.', '{,}') + '\\,' + variablePart;
    }

    function antiderivativeCoeffLatex(k) {
      const eps = 1e-10;
      if (Math.abs(k) < eps) return '0';
      if (Math.abs(k - 1) < eps) return '\\frac{1}{3}x^3';
      if (Math.abs(k + 1) < eps) return '-\\frac{1}{3}x^3';
      const v = Math.round(k * 10) / 10;
      const sign = v < 0 ? '-' : '';
      const abs = Math.abs(v);
      const absTex = Number.isInteger(abs) ? String(abs) : String(abs).replace('.', '{,}');
      return `${sign}\\frac{${absTex}}{3}x^3`;
    }

    function renderMath() {
      if (window.MathJax?.typesetPromise) {
        MathJax.typesetClear?.();
        MathJax.typesetPromise();
      }
    }

    function updateFormulas(k) {
      document.getElementById('kValue').textContent = fmt(k);
      document.getElementById('formulaF').innerHTML = `\\(f(x)=${coeffLatex(k, 'x^2')}\\)`;
      document.getElementById('formulaCapF').innerHTML = `\\(F(x)=${antiderivativeCoeffLatex(k)}\\)`;
      document.getElementById('probeFormula').innerHTML = `\\(F'(x)=${coeffLatex(k, 'x^2')}=f(x)\\)`;
      renderMath();
    }

    function updateGeoGebra(k) {
      if (appletF) {
        appletF.setValue('k', k);
      }
      if (appletCapF) {
        appletCapF.setValue('k', k);
      }
    }

    function createApplet(targetId, isAntiderivative) {
      const params = {
        id: targetId + '_applet',
        appName: 'classic',
        perspective: 'G',
        showAlgebraView: false,
        showGraphicsView: true,
        allowStyleBar: false,
        enableKeyboard: false,
        width: 800,
        height: 330,
        showToolBar: false,
        showAlgebraInput: false,
        showMenuBar: false,
        showResetIcon: false,
        enableLabelDrags: false,
        enableShiftDragZoom: false,
        enableRightClick: false,
        errorDialogsActive: false,
        useBrowserForJS: true,
        showZoomButtons: false,
        showFullscreenButton: false,
        showSuggestionButtons: false,
        language: 'de',
        preventFocus: true,
        capturingThreshold: null,
        appletOnLoad(api) {
          api.evalCommand('k = 1');
          api.setVisible('k', false);
          api.evalCommand(isAntiderivative ? 'F(x) = k/3 * x^3' : 'f(x) = k * x^2');
          const objName = isAntiderivative ? 'F' : 'f';
          api.setColor(objName, isAntiderivative ? 39 : 220, isAntiderivative ? 102 : 38, isAntiderivative ? 171 : 38);
          api.setLineThickness(objName, 6);
          api.setLabelVisible(objName, true);
          api.setLabelStyle(objName, 0); // Beschriftung direkt am Graphen: f bzw. F
          api.setCoordSystem(-4, 4, -8, 8);
          api.setAxesVisible(true, true);
          api.setGridVisible(true);
          if (isAntiderivative) {
            appletCapF = api;
          } else {
            appletF = api;
          }
          updateGeoGebra(parseFloat(document.getElementById('kSlider').value));
        }
      };

      // Nur Grafikansicht (EV), keine Algebra- oder Eingabeansicht (AV).
      const views = { is3D: 0, AV: 0, SV: 0, CV: 0, EV2: 0, CP: 0, PC: 0, DA: 0, FI: 0, EV: 1 };
      const app = new GGBApplet(params, true, views);
      app.inject(targetId);
    }

    function blockGraphGestures(el) {
      ['touchstart', 'touchmove', 'touchend', 'gesturestart', 'gesturechange', 'gestureend', 'wheel', 'pointermove'].forEach(type => {
        el.addEventListener(type, (e) => {
          if (type === 'touchstart' || type === 'touchmove' || type === 'gesturestart' || type === 'gesturechange' || type === 'wheel') {
            e.preventDefault();
          }
        }, { passive: false, capture: true });
      });
    }

    window.addEventListener('load', () => {
      createApplet('ggb-f', false);
      createApplet('ggb-F', true);

      blockGraphGestures(document.getElementById('ggb-f'));
      blockGraphGestures(document.getElementById('ggb-F'));

      const slider = document.getElementById('kSlider');
      const reset = document.getElementById('resetBtn');
      const showAntiderivative = document.getElementById('showAntiderivative');
      const showProbe = document.getElementById('showProbe');
      const probeBox = document.getElementById('probeBox');

      slider.addEventListener('input', () => {
        const k = parseFloat(slider.value);
        updateFormulas(k);
        updateGeoGebra(k);
      });

      reset.addEventListener('click', () => {
        slider.value = '1';
        showAntiderivative.checked = true;
        showProbe.checked = false;
        probeBox.classList.remove('visible');
        updateFormulas(1);
        updateGeoGebra(1);
        if (appletCapF) appletCapF.setVisible('F', true);
      });

      showAntiderivative.addEventListener('change', () => {
        if (appletCapF) appletCapF.setVisible('F', showAntiderivative.checked);
      });

      showProbe.addEventListener('change', () => {
        probeBox.classList.toggle('visible', showProbe.checked);
        renderMath();
      });

      updateFormulas(1);
    });
  </script>
</body>
</html>
