<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Faktorregel – GeoGebra</title><script src="https://www.geogebra.org/apps/deployggb.js"></script><script>window.MathJax={tex:{inlineMath:[["\\(","\\)"]]},svg:{fontCache:"global"}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script><style>

</style></head><body><a href="#applet-hauptinhalt" class="mai-skip">Zum Applet springen</a><nav class="mai-back" aria-label="Zurück und Rechtliches"><a href="../../index.html">← Zur Übersicht 12/13</a> · <a href="../../../../impressum.html">Impressum</a> · <a href="../../../../datenschutz.html">Datenschutz</a></nav><div id="applet-hauptinhalt" tabindex="-1"><main class="app"><header><h1>Faktorregel</h1><button class="btn" id="reset">Zurücksetzen</button></header><div class="layout"><section class="plots" aria-label="GeoGebra-Diagramme"><article class="plot"><h2>Funktion f</h2><div class="graphwrap"><div id="top" class="ggb"></div><div class="lock" aria-hidden="true"></div></div></article><article class="plot"><h2>Stammfunktion F</h2><div class="graphwrap"><div id="bottom" class="ggb"></div><div class="lock" aria-hidden="true"></div></div></article></section><aside class="panel"><h2>Steuerungsbereich</h2><div class="status" id="status">GeoGebra wird geladen … Internetverbindung erforderlich.</div><div class="control"><label for="k">Faktor k <output class="value" id="kval">1,0</output></label><input class="range" id="k" type="range" min="-3" max="3" value="1" step="0.1"><div class="ticks"><span>−3</span><span>0</span><span>3</span></div></div><div class="formula-box" aria-live="polite"><strong>Aktuelle Funktionen</strong><div class="math" id="currentf">\(f(x)=1\cdot x^2\)</div><div class="math" id="currentF">\(F(x)=1\cdot\frac{1}{3}x^3\)</div></div><div class="control"><label class="check"><input id="showF" type="checkbox" checked> Stammfunktion anzeigen</label><label class="check"><input id="showproof" type="checkbox"> Ableitungsprobe anzeigen</label></div><div class="proof" id="proof" hidden><strong>Ableitungsprobe</strong><div id="prooftext"></div></div></aside></div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const state={k:1,showF:true,showproof:false};let apis={},ready=0;const fmt=n=>Number(n.toFixed(1)).toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1});function command(api,s){try{api.evalCommand(s)}catch(e){console.warn('GeoGebra:',s,e)}}function style(api,name,color){try{api.setColor(name,...color);api.setLineThickness(name,5);api.setLabelVisible(name,false);api.setFixed(name,true,false)}catch(e){}}function setup(which,api){apis[which]=api;try{api.setCoordSystem(-3.4,3.4,-30,30);api.setAxesVisible(true,true);api.setAxisLabels(1,'x',which==='top'?'f(x)':'F(x)','')}catch(e){console.warn('Axis settings:',e)}command(api,'k=1');if(which==='top'){command(api,'f(x)=k*x^2');style(api,'f',[205,75,64])}else{command(api,'F(x)=k*x^3/3');style(api,'F',[35,92,190])}ready++;if(ready===2){$('status').className='status ok';$('status').textContent='Bereit';refresh()}}function refresh(){$('kval').textContent=fmt(state.k);$('k').value=state.k;if(window.MathJax&&MathJax.typesetClear)MathJax.typesetClear([$('currentf'),$('currentF')]);const texK=Number(state.k.toFixed(1)).toString();$('currentf').textContent='\\(f(x)='+texK+'\\cdot x^2\\)';$('currentF').textContent='\\(F(x)='+texK+'\\cdot\\frac{1}{3}x^3\\)';if(window.MathJax&&MathJax.typesetPromise){MathJax.typesetPromise([$('currentf'),$('currentF')]).catch(console.warn)}$('proof').hidden=!state.showproof;$('prooftext').textContent='F′(x) = ('+fmt(state.k)+' · ⅓x³)′ = '+fmt(state.k)+' · x² = f(x)';if(ready<2)return;for(const api of Object.values(apis)){try{api.setValue('k',state.k)}catch(e){}}try{apis.bottom.setVisible('F',state.showF)}catch(e){}}function load(){if(typeof GGBApplet!=='function'){$('status').textContent='GeoGebra konnte nicht geladen werden. Bitte Internetverbindung prüfen.';return}for(const which of ['top','bottom']){const host=$(which),w=Math.max(420,Math.round(host.getBoundingClientRect().width)),h=Math.round(host.getBoundingClientRect().height);const app=new GGBApplet({id:'ggb_faktor_'+which,appName:'classic',width:w,height:h,showMenuBar:false,showToolBar:false,showAlgebraInput:false,showAlgebraView:false,perspective:'G',showResetIcon:false,enableLabelDrags:false,enableShiftDragZoom:false,enableRightClick:false,allowStyleBar:false,showLogging:false,showSplash:false,appletOnLoad:api=>setup(which,api)},true);app.inject(which)}}$('k').addEventListener('input',e=>{state.k=Math.round(Number(e.target.value)*10)/10;refresh()});$('showF').addEventListener('change',e=>{state.showF=e.target.checked;refresh()});$('showproof').addEventListener('change',e=>{state.showproof=e.target.checked;refresh()});$('reset').addEventListener('click',()=>{state.k=1;state.showF=true;state.showproof=false;$('showF').checked=true;$('showproof').checked=false;refresh()});load()})();
</script></div><style>.mai-skip{position:absolute;top:-100px;left:10px;z-index:10000;background:#fff;color:#142d44;padding:12px;border:3px solid #ffbf47}.mai-skip:focus{top:10px}.mai-back{padding:12px 18px;background:#173c59;color:white;font:600 15px/1.6 system-ui,sans-serif}.mai-back a{color:white;text-decoration:underline;text-underline-offset:3px}.mai-back a:focus-visible{outline:3px solid #ffbf47;outline-offset:3px}</style></body></html>
